apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "movies.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 0
      {{- if .Values.load }}
      initContainers:
        - name: load-data
          image: {{ .Values.image }}
          command:
            - /usr/local/bin/api
            - load-data
      {{- end }}
      containers:
        - name: api
          image: {{ .Values.image }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger:4317"
            - name: OTEL_SERVICE_NAME
              value: "api"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
