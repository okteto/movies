apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels:
    {{- include "movies.labels" . | nindent 4 }}
  annotations:
    dev.okteto.com/generate-host: "movies"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - http:
        paths:
          - path: /rentals
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /api/ws
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
