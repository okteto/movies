apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  labels:
    {{- include "movies.labels" . | nindent 4 }}
  annotations:
    dev.okteto.com/generate-host: movies
spec:
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /rentals
    backendRefs:
    - name: api
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /users
    backendRefs:
    - name: api
      port: 8080