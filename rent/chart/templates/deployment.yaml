apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rent
  name: rent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rent
  template:
    metadata:
      labels:
        app: rent
    spec:
      containers:
      - image: {{ .Values.image }}
        name: rent
        env:
        - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
          value: "http://jaeger:4318/v1/traces"
        - name: OTEL_SERVICE_NAME
          value: "rent"
        ports:
        - containerPort: 8080
          name: rent
