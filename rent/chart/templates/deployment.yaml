apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rent
  name: rent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rent
  template:
    metadata:
      labels:
        app: rent
    spec:
      containers:
      - image: {{ .Values.image }}
        name: rent
        env:
        - name: SESSION_SECRET
          value: {{ .Values.sessionSecret | quote }}
        - name: API_URL
          value: "http://api:8080"
        ports:
        - containerPort: 8080
          name: rent
